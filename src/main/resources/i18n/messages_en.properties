help.title=Application Guide
help.studentContent=The student portal is only for scholarship application.\n\n1. Log in with user student.\n2. Read the criteria on the first page.\n3. Click Start application or Ctrl+N.\n4. Choose faculty and program, complete contacts, financial data, and document checklist.\n5. After saving, the application reaches the admin with Pending status.
help.content=This application is used for student scholarship application and management.\n\n1. From the File menu choose "New Application" to complete the form.\n2. Fill in the student data and confirm the documents.\n3. Use Ctrl+N for a new application, Ctrl+T for the table, Ctrl+D for dashboard, Ctrl+B for the database window and F1 for help.\n4. In the table you can search, approve, reject or delete applications; right click a row for the shortcut menu.\n5. From the Language menu you can switch between Albanian and English.\n6. The dashboard shows statistics, BI charts and a simple AI recommendation. Click a status metric or pie slice to view those applications.
