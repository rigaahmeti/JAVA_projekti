help.title=Udhëzues i Aplikacionit
help.studentContent=Portali studentor lejon vetem aplikimin ne burse.\n\n1. Hyr me perdoruesin student.\n2. Lexo kriteret ne faqen e pare.\n3. Kliko Fillo aplikimin ose Ctrl+N.\n4. Zgjidh fakultetin dhe drejtimin, ploteso kontaktet, gjendjen financiare dhe checklist-in e dokumenteve.\n5. Pas ruajtjes, aplikimi kalon te admini me status Pending.
help.content=Ky aplikacion shërben për aplikimin dhe menaxhimin e bursave studentore.\n\n1. Nga menuja File zgjidhni "Aplikim i Ri" për të plotësuar formën.\n2. Plotësoni të dhënat e studentit dhe konfirmoni dokumentet.\n3. Përdorni Ctrl+N për aplikim të ri, Ctrl+T për tabelën, Ctrl+D për dashboard, Ctrl+B per databazen dhe F1 për ndihmë.\n4. Në tabelë mund të kërkoni, aprovoni, refuzoni ose fshini aplikime; klikoni me te djathten mbi rresht per shortcut menu.\n5. Nga menuja Gjuha mund të kaloni në Shqip ose Anglisht.\n6. Dashboard shfaq statistika, grafike BI dhe rekomandim AI të thjeshtë. Klikoni metriken e statusit ose pjesen e grafikut rrethor per t'i pare aplikimet.
